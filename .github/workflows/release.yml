name: release

# 发版唯一入口：npm version patch|minor|major && git push --follow-tags
# tag 去掉 v 前缀必须等于 package.json version（build 的第一步校验）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 祖先判定需要完整历史

      - name: 仅允许 main 分支上的提交发版
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::tag ${GITHUB_REF_NAME} 指向的提交不在 main 分支上，拒绝发版"; exit 1; }

      # Bun 版本与构建镜像保持一致。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')"
          echo "tag=$tag package.json=$pkg"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$tag" = "$pkg" ]

      # gdscript.wasm 靠 docker+emscripten 自建（慢），按 lockfile 缓存；命中后 sync-wasm 自动跳过
      - uses: actions/cache@v6
        with:
          path: wasm/
          key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'scripts/sync-wasm.ts') }}

      - run: bun install --frozen-lockfile
      - run: bun run build:release

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist/npm/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: app-image-context
          path: dist/app-image/
          include-hidden-files: true
          if-no-files-found: error

  app-image:
    needs: build
    if: github.repository == 'firede/renview'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@v8
        with:
          name: app-image-context
          path: dist/app-image
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 封装已验证的应用产物
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          build-contexts: release=./dist/app-image
          build-args: |
            APP_BUILD=release
            APP_REVISION=${{ github.sha }}
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}-app:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: 验证实际镜像
        run: bun run smoke:app "$APP_TAG"
        env:
          APP_TAG: ghcr.io/${{ github.repository }}-app:${{ github.ref_name }}
      - name: 推送验证后的同一镜像
        id: push
        run: |
          docker push "$APP_TAG"
          image=$(docker image inspect "$APP_TAG" --format '{{index .RepoDigests 0}}')
          echo "image=$image" >> "$GITHUB_OUTPUT"
        env:
          APP_TAG: ghcr.io/${{ github.repository }}-app:${{ github.ref_name }}

  # 按平台在真实 runner 上冒烟：解开对应 tarball，--version 输出必须等于 tag 版本
  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 } # macos-13 已退役，Intel 仅剩此镜像
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: windows-11-arm, target: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/release
      - name: 真实二进制 --version 对拍 tag
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "dist/release/renview-${{ matrix.target }}.tar.gz" -C dist/release
          bin="dist/release/renview"
          if [[ "${{ matrix.target }}" == windows-* ]]; then bin="dist/release/renview.exe"; fi
          got="$("$bin" --version | tr -d '[:space:]')"
          expected="${GITHUB_REF_NAME#v}"
          echo "target=${{ matrix.target }} got=$got expected=$expected"
          [ "$got" = "$expected" ]

  publish:
    needs: [smoke, app-image]
    # 防 fork 误发
    if: github.repository == 'firede/renview'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # npm Trusted Publishing (OIDC)，免 NPM_TOKEN
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/npm
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/release

      # Trusted Publishing 要求 npm CLI ≥ 11.5.1；node 24 自带的未必够新，显式升级
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@latest

      - name: 发布平台包与壳包（先平台后壳，OIDC 自动带 provenance）
        run: |
          set -euo pipefail
          for p in dist/npm/renview-*/; do
            npm publish --access public "$p"
          done
          npm publish --access public dist/npm/renview

      - name: GitHub Release 挂 tarball 镜像
        run: gh release create "$GITHUB_REF_NAME" dist/release/*.tar.gz dist/release/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  deploy:
    needs: [publish, app-image]
    if: github.repository == 'firede/renview'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: app-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: 部署已发布版本
        run: bash scripts/deploy-app.sh
        env:
          APP_VERSION: ${{ github.ref_name }}
          APP_IMAGE: ${{ needs.app-image.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
